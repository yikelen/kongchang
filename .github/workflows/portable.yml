name: portable-zip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pack:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle portable Python + PySide6
        run: python -u scripts/setup_portable_python.py

      - name: Bundle mpv
        run: python -u scripts/download_mpv.py

      - name: Zip
        shell: cmd
        run: |
          set NAME=kongchang-windows-portable-${{ github.ref_name }}
          if "%NAME%"=="kongchang-windows-portable-" set NAME=kongchang-windows-portable-dev
          mkdir pack 2>nul
          robocopy . pack\kongchang /E /NFL /NDL /NJH /NJS /XD .git pack .github __pycache__ .venv /XF *.pyc *.pid splash.close
          if errorlevel 8 exit /b 1
          tar.exe -a -c -f %NAME%.zip -C pack kongchang
          if not exist %NAME%.zip exit /b 1
          echo ASSET=%NAME%.zip>> %GITHUB_ENV%
          dir %NAME%.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
