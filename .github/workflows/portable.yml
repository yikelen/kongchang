name: portable-zip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pack:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle portable Python + PySide6
        run: python -u scripts/setup_portable_python.py

      - name: Bundle mpv
        run: python -u scripts/download_mpv.py

      - name: Zip
        shell: pwsh
        run: |
          $name = "kongchang-windows-portable-${{ github.ref_name }}"
          if ($name -eq "kongchang-windows-portable-") { $name = "kongchang-windows-portable-dev" }
          New-Item -ItemType Directory -Force -Path pack | Out-Null
          robocopy . "pack\kongchang" /E /XD .git pack .github __pycache__ .venv /XF *.pyc *.pid splash.close
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed $LASTEXITCODE" }
          Compress-Archive -Path "pack\kongchang" -DestinationPath "$name.zip" -Force
          echo "ASSET=$name.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
